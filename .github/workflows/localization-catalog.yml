name: Extract localization catalog

on:
  workflow_dispatch:
  push:
    branches:
      - codex/all-app-store-languages

permissions:
  contents: read

jobs:
  extract:
    name: Extract every ReceiptSure UI string
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out ReceiptSure
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ReceiptSure
        run: |
          xcodebuild \
            -project ReceiptArchive.xcodeproj \
            -scheme ReceiptArchive \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SWIFT_EMIT_LOC_STRINGS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Export the English source localization
        run: |
          mkdir -p localization-export
          xcodebuild \
            -exportLocalizations \
            -project ReceiptArchive.xcodeproj \
            -scheme ReceiptArchive \
            -localizationPath localization-export \
            -exportLanguage en \
            SWIFT_EMIT_LOC_STRINGS=YES

      - name: Validate extracted inventory
        run: python3 scripts/validate-localizations.py --xliff localization-export

      - name: Upload extracted catalog
        uses: actions/upload-artifact@v4
        with:
          name: receiptsure-localization-catalog
          path: |
            ReceiptArchive/Resources/Localizable.xcstrings
            ReceiptArchive/Resources/InfoPlist.xcstrings
            localization-export
          if-no-files-found: error
