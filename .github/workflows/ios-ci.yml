name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate and build Receipt Archive
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ReceiptArchive.xcodeproj
          -scheme ReceiptArchive
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          clean build

      - name: Archive unsigned release for iPhone
        run: >-
          xcodebuild
          -project ReceiptArchive.xcodeproj
          -scheme ReceiptArchive
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/ReceiptSure.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Verify release bundle contents
        run: |
          APP_BUNDLE="$(find "$RUNNER_TEMP/ReceiptSure.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE"
          test -f "$APP_BUNDLE/Info.plist"
          test -f "$APP_BUNDLE/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_BUNDLE/Info.plist" | grep -Fx "com.bodywiseremedy.receiptsure"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_BUNDLE/Info.plist" | grep -Fx "ReceiptSure"
