name: ReceiptArchive
options:
  bundleIdPrefix: com.bodywiseremedy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  ReceiptArchive:
    type: application
    platform: iOS
    sources:
      - path: ReceiptArchive
        excludes:
          - Resources
    resources:
      - ReceiptArchive/Resources/Assets.xcassets
      - ReceiptArchive/Resources/PrivacyInfo.xcprivacy
    info:
      path: ReceiptArchive/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bodywiseremedy.receiptsure
        PRODUCT_NAME: ReceiptSure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  ReceiptArchive:
    build:
      targets:
        ReceiptArchive: all
    run:
      config: Debug
    archive:
      config: Release
