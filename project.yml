name: ReceiptArchive
options:
  bundleIdPrefix: com.bodywiseremedy
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: B5DJ69S32C
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 1.1
fileGroups:
  - ReceiptArchive/Resources/ReceiptSure.storekit
targets:
  ReceiptArchive:
    type: application
    platform: iOS
    sources:
      - path: ReceiptArchive
        excludes:
          - Resources
      - path: ReceiptArchive/Resources/Assets.xcassets
        buildPhase: resources
      - path: ReceiptArchive/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ReceiptArchive/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ReceiptArchive/Resources/InfoPlist.xcstrings
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ReceiptArchive/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReceiptArchive/Resources/ReceiptArchive.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.bodywiseremedy.receiptsure
        PRODUCT_NAME: ReceiptSure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  ReceiptArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReceiptArchiveTests
    dependencies:
      - target: ReceiptArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bodywiseremedy.receiptsure.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReceiptSure.app/ReceiptSure"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ReceiptArchive:
    build:
      targets:
        ReceiptArchive: all
    run:
      config: Debug
      storeKitConfiguration: ReceiptArchive/Resources/ReceiptSure.storekit
    test:
      targets:
        - ReceiptArchiveTests
    archive:
      config: Release
